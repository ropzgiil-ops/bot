name: Build iOS IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Web Content & Permissions
        run: |
          set -e
          # Создаем директории и копируем index.html
          mkdir -p IronLog/www
          if [ -f "index.html" ]; then
            cp "index.html" IronLog/www/index.html
          fi

          # Обновляем Info.plist с правами для iOS
          cat << 'PLIST_EOF' > IronLog/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>ru</string>
          	<key>CFBundleDisplayName</key>
          	<string>IronLog DDX</string>
          	<key>CFBundleExecutable</key>
          	<string>IronLog</string>
          	<key>CFBundleIdentifier</key>
          	<string>com.ddx.ironlog</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>IronLog</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>4.0.0</string>
          	<key>CFBundleVersion</key>
          	<string>4</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>NSAppTransportSecurity</key>
          	<dict>
          		<key>NSAllowsArbitraryLoads</key>
          		<true/>
          	</dict>
          	<key>NSCameraUsageDescription</key>
          	<string>Камера для сканирования инвентаря</string>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UIRequiredDeviceCapabilities</key>
          	<array>
          		<string>arm64</string>
          	</array>
          	<key>UIRequiresFullScreen</key>
          	<true/>
          	<key>UIStatusBarStyle</key>
          	<string>UIStatusBarStyleLightContent</string>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          	</array>
          </dict>
          </plist>
          PLIST_EOF

      - name: Build IPA via Xcode / SDK
        run: |
          set -e
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Payload/IronLog.app/www

          cp IronLog/www/index.html Payload/IronLog.app/www/index.html
          cp IronLog/www/index.html Payload/IronLog.app/index.html
          cp IronLog/Info.plist Payload/IronLog.app/Info.plist

          # Компиляция всех Swift файлов проекта с полной поддержкой WebKit и UIKit
          swiftc -sdk "$SDK_PATH" \
                 -target arm64-apple-ios14.0 \
                 -framework UIKit \
                 -framework WebKit \
                 -O \
                 IronLog/AppDelegate.swift \
                 IronLog/ViewController.swift \
                 -o Payload/IronLog.app/IronLog

          chmod +x Payload/IronLog.app/IronLog
          zip -r IronLog_DDX.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronLog_DDX_IPA
          path: IronLog_DDX.ipa
