name: Build Native iOS App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Valid iOS Binary and Package IPA
        run: |
          set -e
          mkdir -p Payload/IronLog.app

          # Создаем минимальный валидный компилируемый файл на Swift под iOS arm64, 
          # чтобы Sideloadly мог его подписать без ошибки macho sign
          cat << 'SWIFT_EOF' > main.swift
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let win = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = UIColor(red: 0.02, green: 0.03, blue: 0.07, alpha: 1.0)
                  
                  let label = UILabel()
                  label.text = "IronLog DDX Active"
                  label.textColor = .cyan
                  label.font = UIFont.boldSystemFont(ofSize: 20)
                  label.translatesAutoresizingMaskIntoConstraints = false
                  vc.view.addSubview(label)
                  NSLayoutConstraint.activate([
                      label.centerXAnchor.constraint(equalTo: vc.view.centerXAnchor),
                      label.centerYAnchor.constraint(equalTo: vc.view.centerYAnchor)
                  ])

                  win.rootViewController = vc
                  win.makeKeyAndVisible()
                  self.window = win
                  return true
              }
          }
          SWIFT_EOF

          # Компилируем в настоящий Mach-O исполняемый файл arm64
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK_PATH" \
                 -target arm64-apple-ios14.0 \
                 -framework UIKit \
                 -framework Foundation \
                 -parse-as-library \
                 -O \
                 main.swift \
                 -o Payload/IronLog.app/IronLog

          # Создаем правильный Info.plist
          cat << 'PLIST_EOF' > Payload/IronLog.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>ru</string>
          	<key>CFBundleDisplayName</key>
          	<string>IronLog DDX</string>
          	<key>CFBundleExecutable</key>
          	<string>IronLog</string>
          	<key>CFBundleIdentifier</key>
          	<string>com.ddx.ironlog</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>IronLog</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>15.0</string>
          	<key>CFBundleVersion</key>
          	<string>15</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UIRequiredDeviceCapabilities</key>
          	<array>
          		<string>arm64</string>
          	</array>
          	<key>UIRequiresFullScreen</key>
          	<true/>
          	<key>UIStatusBarStyle</key>
          	<string>UIStatusBarStyleLightContent</string>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          	</array>
          </dict>
          </plist>
          PLIST_EOF

          chmod +x Payload/IronLog.app/IronLog
          zip -r IronLog_DDX.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronLog_DDX_IPA
          path: IronLog_DDX.ipa
