name: Build iOS IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Patched Swift & Config
        run: |
          mkdir -p IronLog
          
          # Info.plist с правами для камеры и сети
          cat << 'PLIST_EOF' > IronLog/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>ru</string>
          	<key>CFBundleDisplayName</key>
          	<string>IronLog DDX</string>
          	<key>CFBundleExecutable</key>
          	<string>IronLog</string>
          	<key>CFBundleIdentifier</key>
          	<string>com.ddx.ironlog</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>IronLog</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>4.0.0</string>
          	<key>CFBundleVersion</key>
          	<string>4</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>NSAppTransportSecurity</key>
          	<dict>
          		<key>NSAllowsArbitraryLoads</key>
          		<true/>
          		<key>NSAllowsArbitraryLoadsInWebContent</key>
          		<true/>
          		<key>NSAllowsLocalNetworking</key>
          		<true/>
          	</dict>
          	<key>NSCameraUsageDescription</key>
          	<string>Камера используется для сканирования тренажеров Technogym.</string>
          	<key>NSMicrophoneUsageDescription</key>
          	<string>Микрофон используется для голосовой диктовки тренеру.</string>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UIRequiredDeviceCapabilities</key>
          	<array>
          		<string>arm64</string>
          	</array>
          	<key>UIRequiresFullScreen</key>
          	<true/>
          	<key>UIStatusBarStyle</key>
          	<string>UIStatusBarStyleLightContent</string>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          	</array>
          	<key>UIViewControllerBasedStatusBarAppearance</key>
          	<false/>
          </dict>
          </plist>
          PLIST_EOF

          # ViewController.swift с гарантированной загрузкой index.html
          cat << 'SWIFT_EOF' > IronLog/ViewController.swift
          import UIKit
          import WebKit

          class ViewController: UIViewController, WKUIDelegate, WKNavigationDelegate {
              var webView: WKWebView!

              override var preferredStatusBarStyle: UIStatusBarStyle {
                  return .lightContent
              }

              override func loadView() {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  config.websiteDataStore = WKWebsiteDataStore.default()
                  
                  let prefs = WKWebpagePreferences()
                  prefs.allowsContentJavaScript = true
                  config.defaultWebpagePreferences = prefs

                  webView = WKWebView(frame: .zero, configuration: config)
                  webView.uiDelegate = self
                  webView.navigationDelegate = self
                  webView.scrollView.bounces = false
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.isOpaque = false
                  webView.backgroundColor = UIColor(red: 0.02, green: 0.03, blue: 0.07, alpha: 1.0)

                  self.view = webView
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  loadLocalApp()
              }

              func loadLocalApp() {
                  let bundleURL = Bundle.main.bundleURL
                  let fileManager = FileManager.default

                  let candidates = [
                      bundleURL.appendingPathComponent("index.html"),
                      bundleURL.appendingPathComponent("www").appendingPathComponent("index.html"),
                      Bundle.main.url(forResource: "index", withExtension: "html"),
                      Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "www")
                  ].compactMap { $0 }

                  for fileURL in candidates {
                      if fileManager.fileExists(atPath: fileURL.path) {
                          webView.loadFileURL(fileURL, allowingReadAccessTo: bundleURL)
                          return
                      }
                  }

                  for fileURL in candidates {
                      if let htmlString = try? String(contentsOf: fileURL, encoding: .utf8) {
                          webView.loadHTMLString(htmlString, baseURL: bundleURL)
                          return
                      }
                  }
              }
          }
          SWIFT_EOF

          # AppDelegate.swift
          cat << 'APP_EOF' > IronLog/AppDelegate.swift
          import UIKit
          import WebKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let win = UIWindow(frame: UIScreen.main.bounds)
                  win.backgroundColor = UIColor(red: 0.02, green: 0.03, blue: 0.07, alpha: 1.0)
                  win.rootViewController = ViewController()
                  win.makeKeyAndVisible()
                  self.window = win
                  return true
              }
          }
          APP_EOF

      - name: Compile Native iOS Mach-O Binary & Create IPA
        run: |
          set -e
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          mkdir -p Payload/IronLog.app/www

          # Записываем обновленный файл во все возможные локации
          if [ -f "index.html" ]; then
            cp "index.html" Payload/IronLog.app/www/index.html
            cp "index.html" Payload/IronLog.app/index.html
          elif [ -f "IronLog/www/index.html" ]; then
            cp "IronLog/www/index.html" Payload/IronLog.app/www/index.html
            cp "IronLog/www/index.html" Payload/IronLog.app/index.html
          fi

          cp IronLog/Info.plist Payload/IronLog.app/Info.plist

          swiftc -sdk "$SDK_PATH" \
                 -target arm64-apple-ios14.0 \
                 -framework UIKit \
                 -framework WebKit \
                 -O \
                 IronLog/AppDelegate.swift \
                 IronLog/ViewController.swift \
                 -o Payload/IronLog.app/IronLog

          chmod +x Payload/IronLog.app/IronLog
          zip -r IronLog_DDX.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronLog_DDX_IPA
          path: IronLog_DDX.ipa
