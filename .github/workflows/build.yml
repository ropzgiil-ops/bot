name: Build iOS IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_14.3.1.app

      - name: Build App Archive
        run: |
          xcodebuild -project IronLog.xcodeproj \
                     -scheme IronLog \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath $PWD/build/IronLog.xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/IronLog.xcarchive/Products/Applications/IronLog.app Payload/
          zip -r IronLog_DDX.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: IronLog_DDX_IPA
          path: IronLog_DDX.ipa
