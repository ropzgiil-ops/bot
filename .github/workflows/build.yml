name: Build iOS IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare App & Fix iOS Touch Engine
        run: |
          mkdir -p Payload/IronLog.app/www

          # 1. Info.plist
          cat << 'EOF' > Payload/IronLog.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>ru</string>
          	<key>CFBundleDisplayName</key>
          	<string>IronLog DDX</string>
          	<key>CFBundleExecutable</key>
          	<string>IronLog</string>
          	<key>CFBundleIdentifier</key>
          	<string>com.ddx.ironlog</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>IronLog</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>4.0.0</string>
          	<key>CFBundleVersion</key>
          	<string>4</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>NSAppTransportSecurity</key>
          	<dict>
          		<key>NSAllowsArbitraryLoads</key>
          		<true/>
          	</dict>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UIRequiredDeviceCapabilities</key>
          	<array>
          		<string>arm64</string>
          	</array>
          	<key>UIRequiresFullScreen</key>
          	<true/>
          	<key>UIStatusBarStyle</key>
          	<string>UIStatusBarStyleLightContent</string>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          	</array>
          </dict>
          </plist>
          EOF

          # 2. Находим index.html в репозитории
          if [ -f "index.html" ]; then
            cp "index.html" Payload/IronLog.app/www/index.html
          elif [ -f "IronLog/www/index.html" ]; then
            cp "IronLog/www/index.html" Payload/IronLog.app/www/index.html
          elif [ -f "IronLog/index.html" ]; then
            cp "IronLog/index.html" Payload/IronLog.app/www/index.html
          fi

          # 3. Нативный контейнер без задержки тапов и с поддержкой звука
          cat << 'EOF' > main.swift
          import UIKit
          import WebKit

          class WebViewController: UIViewController, WKNavigationDelegate, WKUIDelegate {
              var webView: WKWebView!

              override var preferredStatusBarStyle: UIStatusBarStyle {
                  return .lightContent
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = UIColor(red: 0.03, green: 0.05, blue: 0.08, alpha: 1.0)

                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  
                  let script = WKUserScript(source: "document.documentElement.style.webkitTouchCallout='none'; document.documentElement.style.webkitUserSelect='none';", injectionTime: .atDocumentEnd, forMainFrameOnly: true)
                  config.userContentController.addUserScript(script)

                  webView = WKWebView(frame: view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.navigationDelegate = self
                  webView.uiDelegate = self
                  webView.isOpaque = false
                  webView.backgroundColor = .clear
                  webView.scrollView.bounces = false
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  view.addSubview(webView)

                  let wwwURL = Bundle.main.bundleURL.appendingPathComponent("www")
                  let indexURL = wwwURL.appendingPathComponent("index.html")

                  if FileManager.default.fileExists(atPath: indexURL.path) {
                      webView.loadFileURL(indexURL, allowingReadAccessTo: Bundle.main.bundleURL)
                  } else {
                      let html = "<html><body style='background:#0b0f19;color:white;font-family:sans-serif;padding:30px;text-align:center;'><h2>Файл index.html не найден</h2></body></html>"
                      webView.loadHTMLString(html, baseURL: nil)
                  }
              }
          }

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let win = UIWindow(frame: UIScreen.main.bounds
