name: Build iOS Native IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Clean Native Swift & Plist
        run: |
          mkdir -p IronLog
          
          # 1. Info.plist
          cat << 'PLIST_EOF' > IronLog/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>ru</string>
          	<key>CFBundleDisplayName</key>
          	<string>IronLog DDX</string>
          	<key>CFBundleExecutable</key>
          	<string>IronLog</string>
          	<key>CFBundleIdentifier</key>
          	<string>com.ddx.ironlog</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>IronLog</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>6.0.0</string>
          	<key>CFBundleVersion</key>
          	<string>6</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UIRequiredDeviceCapabilities</key>
          	<array>
          		<string>arm64</string>
          	</array>
          	<key>UIRequiresFullScreen</key>
          	<true/>
          	<key>UIStatusBarStyle</key>
          	<string>UIStatusBarStyleLightContent</string>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          	</array>
          </dict>
          </plist>
          PLIST_EOF

          # 2. Native SwiftUI App Entrypoint
          cat << 'APP_EOF' > IronLog/App.swift
          import SwiftUI

          struct WorkoutSet: Identifiable, Codable {
              var id = UUID()
              var weight: Double
              var reps: Int
              var isCompleted: Bool = false
              
              var oneRepMax: Double {
                  guard reps > 0 else { return 0 }
                  return weight * (1.0 + Double(reps) / 30.0)
              }
          }

          struct Exercise: Identifiable, Codable {
              var id = UUID()
              var name: String
              var muscleGroup: String
              var sets: [WorkoutSet]
          }

          struct CompletedWorkout: Identifiable, Codable {
              var id = UUID()
              var title: String
              var date: Date
              var totalVolume: Double
              var totalSets: Int
          }

          struct PersonalRecord: Identifiable, Codable {
              var id = UUID()
              var exerciseName: String
              var weight: Double
              var date: Date
          }

          struct ChatMessage: Identifiable, Codable {
              var id = UUID()
              var sender: String
              var text: String
              var time: String
          }

          class WorkoutStore: ObservableObject {
              @Published var activeExercises: [Exercise] = []
              @Published var isWorkoutActive: Bool = false
              @Published var workoutTimerSeconds: Int = 0
              @Published var restTimerSeconds: Int = 0
              @Published var isRestTimerRunning: Bool = false
              
              @Published var history: [CompletedWorkout] = []
              @Published var records: [PersonalRecord] = []
              @Published var chatMessages: [ChatMessage] = []
              
              private var timer: Timer?
              
              init() {
                  loadData()
                  if chatMessages.isEmpty {
                      chatMessages.append(ChatMessage(
                          sender: "coach",
                          text: "Привет, атлет! Я IronCoach. Твой сплит верхнего тела готов к работе. Задавай любой вопрос по технике, весам или питанию!",
                          time: "Сейчас"
                      ))
                  }
              }
              
              func startWorkout(title: String) {
                  activeExercises = defaultExercises(for: title)
                  isWorkoutActive = true
                  workoutTimerSeconds = 0
                  timer = Timer.scheduledTimer(withTimeInterval: 1.0, repeats: true) { [weak self] _ in
                      guard let self = self else { return }
                      self.workoutTimerSeconds += 1
                      if self.isRestTimerRunning && self.restTimerSeconds > 0 {
                          self.restTimerSeconds -= 1
                          if self.restTimerSeconds == 0 {
                              self.isRestTimerRunning = false
                              let generator = UINotificationFeedbackGenerator()
                              generator.notificationOccurred(.success)
                          }
                      }
                  }
              }
              
              func finishWorkout() {
                  var volume: Double = 0
                  var completedSets = 0
                  
                  for ex in activeExercises {
                      for set in ex.sets where set.isCompleted {
                          volume += set.weight * Double(set.reps)
                          completedSets += 1
                          
                          let current1RM = set.oneRepMax
                          if let idx = records.firstIndex(where: { $0.exerciseName == ex.name }) {
                              if current1RM > records[idx].weight {
                                  records[idx].weight = current1RM
                                  records[idx].date = Date()
                              }
                          } else if set.weight > 0 {
                              records.append(PersonalRecord(exerciseName: ex.name, weight: current1RM, date: Date()))
                          }
                      }
                  }
                  
                  let completed = CompletedWorkout(
                      title: "Тренировка сплита",
                      date: Date(),
                      totalVolume: volume,
                      totalSets: completedSets
                  )
                  history.insert(completed, at: 0)
                  isWorkoutActive = false
                  timer?.invalidate()
                  timer = nil
                  saveData()
              }
              
              func startRestTimer(seconds: Int = 90) {
                  restTimerSeconds = seconds
                  isRestTimerRunning = true
              }
              
              func addSet(to exerciseID: UUID) {
                  guard let idx = activeExercises.firstIndex(where: { $0.id == exerciseID }) else { return }
                  let lastWeight = activeExercises[idx].sets.last?.weight ?? 60.0
                  let lastReps = activeExercises[idx].sets.last?.reps ?? 10
                  activeExercises[idx].sets.append(WorkoutSet(weight: lastWeight, reps: lastReps))
                  let impact = UIImpactFeedbackGenerator(style: .medium)
                  impact.impactOccurred()
              }
              
              func toggleSet(exerciseID: UUID, setID: UUID) {
                  guard let exIdx = activeExercises.firstIndex(where: { $0.id == exerciseID }),
                        let setIdx = activeExercises[exIdx].sets.firstIndex(where: { $0.id == setID }) else { return }
                  activeExercises[exIdx].sets[setIdx].isCompleted.toggle()
                  
                  let impact = UIImpactFeedbackGenerator(style: .rigid)
                  impact.impactOccurred()
                  
                  if activeExercises[exIdx].sets[setIdx].isCompleted {
                      startRestTimer(seconds: 90)
                  }
              }
              
              func sendMessageToCoach(text: String) {
                  guard !text.trimmingCharacters(in: .whitespaces).isEmpty else { return }
                  let userMsg = ChatMessage(sender: "user", text: text, time: "Сейчас")
                  chatMessages.append(userMsg)
                  
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.6) {
                      let replyText = self.generateCoachAnswer(for: text)
                      self.chatMessages.append(ChatMessage(sender: "coach", text: replyText, time: "Сейчас"))
                      let generator = UINotificationFeedbackGenerator()
                      generator.notificationOccurred(.success)
                      self.saveData()
                  }
                  saveData()
              }
              
              private func generateCoachAnswer(for query: String) -> String {
                  let q = query.lowercased()
                  if q.contains("жим") {
                      return "Жим лёжа: сведи лопатки, опусти плечи вниз к тазу. Локти держи под углом 70-75° к корпусу, гриф опускай на линию низа груди с паузой 1 сек. Выжимай мощно на выдохе."
                  } else if q.contains("креатин") {
                      return "Креатин моногидрат: принимай стабильно по 5 грамм каждый день в одно и то же время, запивая водой. Накопительный эффект наступит через 2-3 недели."
                  } else if q.contains("размин") {
                      return "Пирамида разминки: 1) Гриф × 15-20 раз; 2) 50% от рабочего × 8 раз; 3) 70% × 4 раза; 4) 85% × 1-2 раза. После 2 минут отдыха переходи к рабочим подходам!"
                  } else {
                      return "Держи прогрессию нагрузок: добавляй либо 1 повторение в подходе, либо 1-2.5 кг к штанге каждую неделю при чистой технике."
                  }
              }
              
              private func defaultExercises(for title: String) -> [Exercise] {
                  if title.contains("Спина") {
                      return [
                          Exercise(name: "Тяга верхнего блока к груди", muscleGroup: "Спина", sets: [
                              WorkoutSet(weight: 55, reps: 10),
                              WorkoutSet(weight: 60, reps: 10),
                              WorkoutSet(weight: 65, reps: 8)
                          ]),
                          Exercise(name: "Тяга горизонтального блока к поясу", muscleGroup: "Спина", sets: [
                              WorkoutSet(weight: 50, reps: 10),
                              WorkoutSet(weight: 55, reps: 10)
                          ]),
                          Exercise(name: "Махи гантелями в стороны", muscleGroup: "Плечи", sets: [
                              WorkoutSet(weight: 10, reps: 12),
                              WorkoutSet(weight: 12, reps: 12)
                          ])
                      ]
                  } else if title.contains("Руки") {
                      return [
                          Exercise(name: "Французский жим с EZ-грифом", muscleGroup: "Трицепс", sets: [
                              WorkoutSet(weight: 30, reps: 10),
                              WorkoutSet(weight: 35, reps: 8)
                          ]),
                          Exercise(name: "Разгибания на блоке с канатом", muscleGroup: "Трицепс", sets: [
                              WorkoutSet(weight: 25, reps: 12),
                              WorkoutSet(weight: 30, reps: 10)
                          ]),
                          Exercise(name: "Сгибания на предплечья (хват)", muscleGroup: "Хват", sets: [
                              WorkoutSet(weight: 20, reps: 15),
                              WorkoutSet(weight: 25, reps: 12)
                          ])
                      ]
                  } else {
                      return [
                          Exercise(name: "Жим штанги лёжа", muscleGroup: "Грудь", sets: [
                              WorkoutSet(weight: 70, reps: 8),
                              WorkoutSet(weight: 75, reps: 8),
                              WorkoutSet(weight: 80, reps: 6)
                          ]),
                          Exercise(name: "Жим гантелей на наклонной скамье", muscleGroup: "Грудь", sets: [
                              WorkoutSet(weight: 24, reps: 10),
                              WorkoutSet(weight: 26, reps: 8)
                          ]),
                          Exercise(name: "Подъем штанги на бицепс стоя", muscleGroup: "Бицепс", sets: [
                              WorkoutSet(weight: 35, reps: 10),
                              WorkoutSet(weight: 40, reps: 8)
                          ])
                      ]
                  }
              }
              
              private func saveData() {
                  if let encoded = try? JSONEncoder().encode(history) {
                      UserDefaults.standard.set(encoded, forKey: "ironlog_history")
                  }
                  if let encoded = try? JSONEncoder().encode(records) {
                      UserDefaults.standard.set(encoded, forKey: "ironlog_records")
                  }
                  if let encoded = try? JSONEncoder().encode(chatMessages) {
                      UserDefaults.standard.set(encoded, forKey: "ironlog_chat")
                  }
              }
              
              private func loadData() {
                  if let data = UserDefaults.standard.data(forKey: "ironlog_history"),
                     let decoded = try? JSONDecoder().decode([CompletedWorkout].self, from: data) {
                      self.history = decoded
                  }
                  if let data = UserDefaults.standard.data(forKey: "ironlog_records"),
                     let decoded = try? JSONDecoder().decode([PersonalRecord].self, from: data) {
                      self.records = decoded
                  } else {
                      self.records = [
                          PersonalRecord(exerciseName: "Жим штанги лёжа", weight: 90, date: Date()),
                          PersonalRecord(exerciseName: "Жим гантелей 30°", weight: 32, date: Date()),
                          PersonalRecord(exerciseName: "Бицепс со штангой", weight: 45, date: Date())
                      ]
                  }
                  if let data = UserDefaults.standard.data(forKey: "ironlog_chat"),
                     let decoded = try? JSONDecoder().decode([ChatMessage].self, from: data) {
                      self.chatMessages = decoded
                  }
              }
          }

          @main
          struct IronLogApp: App {
              @StateObject private var store = WorkoutStore()
              
              var body: some Scene {
                  WindowGroup {
                      MainTabView()
                          .environmentObject(store)
                          .preferredColorScheme(.dark)
                  }
              }
          }
          APP_EOF

          # 3. MainTabView.swift
          cat << 'TAB_EOF' > IronLog/MainTabView.swift
          import SwiftUI

          struct MainTabView: View {
              @EnvironmentObject var store: WorkoutStore
              @State private var selectedTab = 0
              
              var body: some View {
                  TabView(selection: $selectedTab) {
                      WorkoutView()
                          .tabItem {
                              Label("Зал", systemImage: "bolt.fill")
                          }
                          .tag(0)
                      
                      RecordsView()
                          .tabItem {
                              Label("Прогресс", systemImage: "trophy.fill")
                          }
                          .tag(1)
                      
                      TimerView()
                          .tabItem {
                              Label("Таймер", systemImage: "stopwatch.fill")
                          }
                          .tag(2)
                      
                      HistoryView()
                          .tabItem {
                              Label("История", systemImage: "calendar")
                          }
                          .tag(3)
                      
                      CoachChatView()
                          .tabItem {
                              Label("Тренер AI", systemImage: "bubble.left.and.bubble.right.fill")
                          }
                          .tag(4)
                  }
                  .accentColor(Color.cyan)
              }
          }

          struct WorkoutView: View {
              @EnvironmentObject var store: WorkoutStore
              
              var body: some View {
                  NavigationView {
                      ZStack {
                          Color(red: 0.03, green: 0.05, blue: 0.08).ignoresSafeArea()
                          
                          ScrollView {
                              VStack(spacing: 16) {
                                  if store.isWorkoutActive {
                                      activeWorkoutHeader
                                      
                                      ForEach(store.activeExercises) { exercise in
                                          ExerciseCard(exercise: exercise)
                                      }
                                      
                                      Button(action: { store.finishWorkout() }) {
                                          HStack {
                                              Image(systemName: "checkmark.circle.fill")
                                              Text("Завершить тренировку")
                                          }
                                          .font(.headline)
                                          .foregroundColor(.black)
                                          .frame(maxWidth: .infinity)
                                          .frame(height: 52)
                                          .background(LinearGradient(colors: [.cyan, .teal], startPoint: .leading, endPoint: .trailing))
                                          .cornerRadius(14)
                                          .shadow(color: .cyan.opacity(0.4), radius: 8, y: 4)
                                      }
                                      .padding(.top, 10)
                                  } else {
                                      idleWorkoutHeader
                                  }
                              }
                              .padding()
                          }
                      }
                      .navigationTitle("IronLog DDX")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
              
              var idleWorkoutHeader: some View {
                  VStack(spacing: 20) {
                      VStack(alignment: .leading, spacing: 8) {
                          Text("Твой 3-дневный сплит (Верх тела)")
                              .font(.caption)
                              .foregroundColor(.cyan)
                              .fontWeight(.bold)
                          Text("Время качать железо!")
                              .font(.title2)
                              .fontWeight(.heavy)
                              .foregroundColor(.white)
                          Text("Сплит: 1. Грудь/Бицепс  •  2. Спина/Плечи  •  3. Трицепс/Хват")
                              .font(.subheadline)
                              .foregroundColor(.gray)
                      }
                      .frame(maxWidth: .infinity, alignment: .leading)
                      .padding()
                      .background(Color(red: 0.07, green: 0.1, blue: 0.15))
                      .cornerRadius(16)
                      
                      VStack(spacing: 12) {
                          splitButton(title: "⚡ День 1: Грудь & Бицепс", subtitle: "Жим штанги, наклонные гантели, бицепс стоя") {
                              store.startWorkout(title: "День 1: Грудь & Бицепс")
                          }
                          splitButton(title: "⚡ День 2: Спина & Плечи", subtitle: "Верхний блок, тяга к поясу, махи") {
                              store.startWorkout(title: "День 2: Спина & Плечи")
                          }
                          splitButton(title: "⚡ День 3: Трицепс & Хват", subtitle: "Французский жим, канат, предплечья") {
                              store.startWorkout(title: "День 3: Трицепс & Хват")
                          }
                      }
                  }
              }
              
              var activeWorkoutHeader: some View {
                  HStack {
                      VStack(alignment: .leading) {
                          Text("ИДЕТ ТРЕНИРОВКА")
                              .font(.caption2)
                              .foregroundColor(.cyan)
                              .fontWeight(.bold)
                          Text(formatTime(store.workoutTimerSeconds))
                              .font(.title)
                              .fontWeight(.heavy)
                              .foregroundColor(.white)
                      }
                      Spacer()
                      if store.isRestTimerRunning {
                          VStack(alignment: .trailing) {
                              Text("ОТДЫХ")
                                  .font(.caption2)
                                  .foregroundColor(.orange)
                                  .fontWeight(.bold)
                              Text("\(store.restTimerSeconds) сек")
                                  .font(.title2)
                                  .fontWeight(.bold)
                                  .foregroundColor(.orange)
                          }
                          .padding(.horizontal, 12)
                          .padding(.vertical, 6)
                          .background(Color.orange.opacity(0.15))
                          .cornerRadius(10)
                      }
                  }
                  .padding()
                  .background(Color(red: 0.07, green: 0.1, blue: 0.15))
                  .cornerRadius(14)
              }
              
              func splitButton(title: String, subtitle: String, action: @escaping () -> Void) -> some View {
                  Button(action: action) {
                      VStack(alignment: .leading, spacing: 4) {
                          Text(title)
                              .font(.headline)
                              .foregroundColor(.white)
                          Text(subtitle)
                              .font(.caption)
                              .foregroundColor(.gray)
                      }
                      .frame(maxWidth: .infinity, alignment: .leading)
                      .padding()
                      .background(Color(red: 0.08, green: 0.12, blue: 0.18))
                      .cornerRadius(14)
                      .overlay(
                          RoundedRectangle(cornerRadius: 14)
                              .stroke(Color.cyan.opacity(0.3), lineWidth: 1)
                      )
                  }
              }
              
              func formatTime(_ totalSeconds: Int) -> String {
                  let m = totalSeconds / 60
                  let s = totalSeconds % 60
                  return String(format: "%02d:%02d", m, s)
              }
          }

          struct ExerciseCard: View {
              @EnvironmentObject var store: WorkoutStore
              var exercise: Exercise
              
              var body: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      HStack {
                          Text(exercise.name)
                              .font(.headline)
                              .foregroundColor(.white)
                          Spacer()
                          Text(exercise.muscleGroup)
                              .font(.caption2)
                              .fontWeight(.bold)
                              .padding(.horizontal, 8)
                              .padding(.vertical, 4)
                              .background(Color.cyan.opacity(0.2))
                              .foregroundColor(.cyan)
                              .cornerRadius(6)
                      }
                      
                      VStack(spacing: 8) {
                          ForEach(Array(exercise.sets.enumerated()), id: \.element.id) { index, set in
                              HStack {
                                  Text("\(index + 1)")
                                      .font(.subheadline)
                                      .foregroundColor(.gray)
                                      .frame(width: 24)
                                  
                                  Text("\(Int(set.weight)) кг × \(set.reps)")
                                      .font(.subheadline)
                                      .fontWeight(.medium)
                                      .foregroundColor(.white)
                                  
                                  if set.oneRepMax > 0 {
                                      Text("1RM: \(Int(set.oneRepMax)) кг")
                                          .font(.caption2)
                                          .foregroundColor(.cyan)
                                          .padding(.horizontal, 6)
                                          .padding(.vertical, 2)
                                          .background(Color.cyan.opacity(0.1))
                                          .cornerRadius(4)
                                  }
                                  
                                  Spacer()
                                  
                                  Button(action: {
                                      store.toggleSet(exerciseID: exercise.id, setID: set.id)
                                  }) {
                                      Image(systemName: set.isCompleted ? "checkmark.circle.fill" : "circle")
                                          .font(.title3)
                                          .foregroundColor(set.isCompleted ? .teal : .gray)
                                  }
                              }
                              .padding(.vertical, 6)
                              .padding(.horizontal, 10)
                              .background(set.isCompleted ? Color.teal.opacity(0.1) : Color(red: 0.05, green: 0.08, blue: 0.12))
                              .cornerRadius(8)
                          }
                      }
                      
                      Button(action: { store.addSet(to: exercise.id) }) {
                          HStack {
                              Image(systemName: "plus")
                              Text("Добавить подход")
                          }
                          .font(.caption)
                          .fontWeight(.bold)
                          .foregroundColor(.cyan)
                          .frame(maxWidth: .infinity)
                          .frame(height: 34)
                          .background(Color.cyan.opacity(0.12))
                          .cornerRadius(8)
                      }
                  }
                  .padding()
                  .background(Color(red: 0.07, green: 0.1, blue: 0.15))
                  .cornerRadius(14)
              }
          }

          struct RecordsView: View {
              @EnvironmentObject var store: WorkoutStore
              @State private var newExerciseName = ""
              @State private var newWeight = ""
              
              var body: some View {
                  NavigationView {
                      ZStack {
                          Color(red: 0.03, green: 0.05, blue: 0.08).ignoresSafeArea()
                          
                          ScrollView {
                              VStack(spacing: 20) {
                                  VStack(spacing: 12) {
                                      Text("Твои рекорды (1RM)")
                                          .font(.title2)
                                          .fontWeight(.bold)
                                          .foregroundColor(.white)
                                          .frame(maxWidth: .infinity, alignment: .leading)
                                      
                                      ForEach(store.records) { rec in
                                          HStack {
                                              VStack(alignment: .leading) {
                                                  Text(rec.exerciseName)
                                                      .font(.headline)
                                                      .foregroundColor(.white)
                                                  Text(rec.date, style: .date)
                                                      .font(.caption2)
                                                      .foregroundColor(.gray)
                                              }
                                              Spacer()
                                              Text("\(Int(rec.weight)) кг")
                                                  .font(.title3)
                                                  .fontWeight(.heavy)
                                                  .foregroundColor(.cyan)
                                          }
                                          .padding()
                                          .background(Color(red: 0.07, green: 0.1, blue: 0.15))
                                          .cornerRadius(12)
                                      }
                                  }
                                  
                                  VStack(alignment: .leading, spacing: 10) {
                                      Text("Записать новый рекорд")
                                          .font(.headline)
                                          .foregroundColor(.white)
                                      
                                      TextField("Упражнение", text: $newExerciseName)
                                          .padding()
                                          .background(Color(red: 0.07, green: 0.1, blue: 0.15))
                                          .cornerRadius(10)
                                          .foregroundColor(.white)
                                      
                                      TextField("Максимальный вес (кг)", text: $newWeight)
                                          .keyboardType(.decimalPad)
                                          .padding()
                                          .background(Color(red: 0.07, green: 0.1, blue: 0.15))
                                          .cornerRadius(10)
                                          .foregroundColor(.white)
                                      
                                      Button(action: saveRecord) {
                                          Text("Сохранить рекорд")
                                              .fontWeight(.bold)
                                              .foregroundColor(.black)
                                              .frame(maxWidth: .infinity)
                                              .frame(height: 48)
                                              .background(Color.cyan)
                                              .cornerRadius(10)
                                      }
                                  }
                                  .padding()
                                  .background(Color(red: 0.05, green: 0.08, blue: 0.12))
                                  .cornerRadius(14)
                              }
                              .padding()
                          }
                      }
                      .navigationTitle("Прогресс")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
              
              func saveRecord() {
                  guard let w = Double(newWeight), !newExerciseName.isEmpty else { return }
                  store.records.append(PersonalRecord(exerciseName: newExerciseName, weight: w, date: Date()))
                  newExerciseName = ""
                  newWeight = ""
                  let generator = UINotificationFeedbackGenerator()
                  generator.notificationOccurred(.success)
              }
          }

          struct TimerView: View {
              @EnvironmentObject var store: WorkoutStore
              @State private var selectedSeconds = 90
              
              var body: some View {
                  ZStack {
                      Color(red: 0.03, green: 0.05, blue: 0.08).ignoresSafeArea()
                      
                      VStack(spacing: 30) {
                          Text("Таймер отдыха")
                              .font(.title)
                              .fontWeight(.bold)
                              .foregroundColor(.white)
                          
                          ZStack {
                              Circle()
                                  .stroke(Color.gray.opacity(0.2), lineWidth: 16)
                                  .frame(width: 240, height: 240)
                              Circle()
                                  .stroke(Color.cyan, style: StrokeStyle(lineWidth: 16, lineCap: .round))
                                  .frame(width: 240, height: 240)
                              
                              VStack {
                                  Text("\(store.restTimerSeconds)")
                                      .font(.system(size: 64, weight: .heavy, design: .rounded))
                                      .foregroundColor(.white)
                                  Text("СЕКУНД")
                                      .font(.caption)
                                      .fontWeight(.bold)
                                      .foregroundColor(.gray)
                              }
                          }
                          
                          HStack(spacing: 12) {
                              timerPresetButton(title: "60с", sec: 60)
                              timerPresetButton(title: "90с", sec: 90)
                              timerPresetButton(title: "120с", sec: 120)
                              timerPresetButton(title: "180с", sec: 180)
                          }
                          
                          Button(action: {
                              if store.isRestTimerRunning {
                                  store.isRestTimerRunning = false
                              } else {
                                  store.startRestTimer(seconds: selectedSeconds)
                              }
                          }) {
                              Text(store.isRestTimerRunning ? "Остановить" : "Запустить таймер")
                                  .font(.headline)
                                  .foregroundColor(.black)
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 52)
                                  .background(store.isRestTimerRunning ? Color.orange : Color.cyan)
                                  .cornerRadius(14)
                          }
                          .padding(.horizontal, 40)
                      }
                      .padding()
                  }
              }
              
              func timerPresetButton(title: String, sec: Int) -> some View {
                  Button(action: {
                      selectedSeconds = sec
                      store.startRestTimer(seconds: sec)
                  }) {
                      Text(title)
                          .font(.headline)
                          .foregroundColor(.white)
                          .frame(width: 68, height: 44)
                          .background(Color(red: 0.08, green: 0.12, blue: 0.18))
                          .cornerRadius(10)
                  }
              }
          }

          struct HistoryView: View {
              @EnvironmentObject var store: WorkoutStore
              
              var body: some View {
                  NavigationView {
                      ZStack {
                          Color(red: 0.03, green: 0.05, blue: 0.08).ignoresSafeArea()
                          
                          if store.history.isEmpty {
                              VStack(spacing: 12) {
                                  Image(systemName: "calendar.badge.clock")
                                      .font(.system(size: 48))
                                      .foregroundColor(.gray)
                                  Text("История пока пуста")
                                      .font(.headline)
                                      .foregroundColor(.gray)
                              }
                          } else {
                              List {
                                  ForEach(store.history) { item in
                                      VStack(alignment: .leading, spacing: 6) {
                                          Text(item.title)
                                              .font(.headline)
                                              .foregroundColor(.white)
                                          HStack {
                                              Text(item.date, style: .date)
                                              Spacer()
                                              Text("Тоннаж: \(Int(item.totalVolume)) кг")
                                                  .foregroundColor(.cyan)
                                              Text("• Подходов: \(item.totalSets)")
                                          }
                                          .font(.caption)
                                          .foregroundColor(.gray)
                                      }
                                      .padding(.vertical, 4)
                                      .listRowBackground(Color(red: 0.07, green: 0.1, blue: 0.15))
                                  }
                              }
                              .scrollContentBackground(.hidden)
                          }
                      }
                      .navigationTitle("История тренировок")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
          }

          struct CoachChatView: View {
              @EnvironmentObject var store: WorkoutStore
              @State private var inputText = ""
              
              var body: some View {
                  NavigationView {
                      ZStack {
                          Color(red: 0.03, green: 0.05, blue: 0.08).ignoresSafeArea()
                          
                          VStack {
                              ScrollViewReader { proxy in
                                  ScrollView {
                                      LazyVStack(spacing: 12) {
                                          ForEach(store.chatMessages) { msg in
                                              HStack {
                                                  if msg.sender == "user" { Spacer() }
                                                  Text(msg.text)
                                                      .padding()
                                                      .background(msg.sender == "user" ? Color.cyan.opacity(0.25) : Color(red: 0.08, green: 0.12, blue: 0.18))
                                                      .foregroundColor(.white)
                                                      .cornerRadius(14)
                                                      .frame(maxWidth: 280, alignment: msg.sender == "user" ? .trailing : .leading)
                                                  if msg.sender == "coach" { Spacer() }
                                              }
                                              .id(msg.id)
                                          }
                                      }
                                      .padding()
                                  }
                                  .onChange(of: store.chatMessages.count) { _ in
                                      if let last = store.chatMessages.last {
                                          proxy.scrollTo(last.id, anchor: .bottom)
                                      }
                                  }
                              }
                              
                              HStack {
                                  TextField("Спроси тренера о технике...", text: $inputText)
                                      .padding(12)
                                      .background(Color(red: 0.08, green: 0.12, blue: 0.18))
                                      .cornerRadius(10)
                                      .foregroundColor(.white)
                                  
                                  Button(action: send) {
                                      Image(systemName: "paperplane.fill")
                                          .font(.title3)
                                          .foregroundColor(.cyan)
                                          .padding(10)
                                  }
                              }
                              .padding()
                          }
                      }
                      .navigationTitle("IronCoach AI")
                      .navigationBarTitleDisplayMode(.inline)
                  }
              }
              
              func send() {
                  let text = inputText
                  inputText = ""
                  store.sendMessageToCoach(text: text)
              }
          }
          TAB_EOF

      - name: Compile Native SwiftUI to Apple Mach-O arm64
        run: |
          set -e
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p Payload/IronLog.app

          cp IronLog/Info.plist Payload/IronLog.app/Info.plist

          swiftc -sdk "$SDK_PATH" \
                 -target arm64-apple-ios15.0 \
                 -framework UIKit \
                 -framework SwiftUI \
                 -O \
                 IronLog/App.swift \
                 IronLog/MainTabView.swift \
                 -o Payload/IronLog.app/IronLog

          chmod +x Payload/IronLog.app/IronLog
          zip -r IronLog_DDX.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronLog_DDX_IPA
          path: IronLog_DDX.ipa
