name: Build iOS IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and Pack Working IPA
        run: |
          set -e
          mkdir -p Payload/IronLog.app/www

          # 1. Копируем index.html
          if [ -f "index.html" ]; then
            cp "index.html" Payload/IronLog.app/www/index.html
          elif [ -f "IronLog/www/index.html" ]; then
            cp "IronLog/www/index.html" Payload/IronLog.app/www/index.html
          elif [ -f "IronLog/index.html" ]; then
            cp "IronLog/index.html" Payload/IronLog.app/www/index.html
          fi

          # 2. Вшиваем патч прямо в начало index.html (защита от падения localStorage на iOS и разблокировка всех кнопок)
          cat << 'PATCH_EOF' > patch.html
          <script>
          (function() {
              var mem = {};
              var safeStore = {
                  getItem: function(k) { return mem.hasOwnProperty(k) ? mem[k] : null; },
                  setItem: function(k, v) { mem[k] = String(v); },
                  removeItem: function(k) { delete mem[k]; },
                  clear: function() { mem = {}; }
              };
              try {
                  localStorage.setItem('_t', '1');
                  localStorage.removeItem('_t');
              } catch (e) {
                  Object.defineProperty(window, 'localStorage', { value: safeStore });
                  Object.defineProperty(window, 'sessionStorage', { value: safeStore });
              }
              window.alert = function(m) { console.log(m); };
              window.confirm = function() { return true; };
          })();
          </script>
          <style>
          * { -webkit-tap-highlight-color: transparent !important; touch-action: manipulation !important; }
          .hidden, [hidden] { display: none !important; pointer-events: none !important; }
          button, a, input, select, textarea, [onclick], [role="button"] { pointer-events: auto !important; cursor: pointer !important; }
          </style>
          PATCH_EOF

          cat patch.html Payload/IronLog.app/www/index.html > Payload/IronLog.app/www/temp.html
          mv Payload/IronLog.app/www/temp.html Payload/IronLog.app/www/index.html
          cp Payload/IronLog.app/www/index.html Payload/IronLog.app/index.html

          # 3. Создаем Info.plist
          cat << 'PLIST_EOF' > Payload/IronLog.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>ru</string>
          	<key>CFBundleDisplayName</key>
          	<string>IronLog DDX</string>
          	<key>CFBundleExecutable</key>
          	<string>IronLog</string>
          	<key>CFBundleIdentifier</key>
          	<string>com.ddx.ironlog</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>IronLog</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>11.0</string>
          	<key>CFBundleVersion</key>
          	<string>11</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>NSAppTransportSecurity</key>
          	<dict>
          		<key>NSAllowsArbitraryLoads</key>
          		<true/>
          	</dict>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UIRequiredDeviceCapabilities</key>
          	<array>
          		<string>arm64</string>
          	</array>
          	<key>UIRequiresFullScreen</key>
          	<true/>
          	<key>UIStatusBarStyle</key>
          	<string>UIStatusBarStyleLightContent</string>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          	</array>
          </dict>
          </plist>
          PLIST_EOF

          # 4. Создаем App.swift (НЕ main.swift, чтобы @main скомпилировался без ошибки!)
          cat << 'SWIFT_EOF' > App.swift
          import UIKit
          import WebKit

          class LocalSchemeHandler: NSObject, WKURLSchemeHandler {
              func webView(_ webView: WKWebView, start urlSchemeTask: WKURLSchemeTask) {
                  let path = Bundle.main.bundlePath + "/www/index.html"
                  if let data = try? Data(contentsOf: URL(fileURLWithPath: path)) {
                      let response = URLResponse(url: urlSchemeTask.request.url!, mimeType: "text/html", expectedContentLength: data.count, textEncodingName: "utf-8")
                      urlSchemeTask.didReceive(response)
                      urlSchemeTask.didReceive(data)
                      urlSchemeTask.didFinish()
                  } else {
                      urlSchemeTask.didFailWithError(NSError(domain: "App", code: 404, userInfo: nil))
                  }
              }
              func webView(_ webView: WKWebView, stop urlSchemeTask: WKURLSchemeTask) {}
          }

          class RootVC: UIViewController, WKUIDelegate, WKNavigationDelegate {
              var webView: WKWebView!
              let handler = LocalSchemeHandler()

              override var preferredStatusBarStyle: UIStatusBarStyle {
                  return .lightContent
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = UIColor(red: 0.02, green: 0.03, blue: 0.07, alpha: 1.0)

                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  config.setURLSchemeHandler(handler, forURLScheme: "app")

                  webView = WKWebView(frame: view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.uiDelegate = self
                  webView.navigationDelegate = self
                  webView.isOpaque = false
                  webView.backgroundColor = UIColor(red: 0.02, green: 0.03, blue: 0.07, alpha: 1.0)
                  webView.scrollView.bounces = false
                  webView.scrollView.delaysContentTouches = false
                  webView.scrollView.contentInsetAdjustmentBehavior = .never

                  view.addSubview(webView)

                  if let url = URL(string: "app://localhost/index.html") {
                      webView.load(URLRequest(url: url))
                  }
              }

              func webView(_ webView: WKWebView, runJavaScriptConfirmPanelWithMessage message: String, initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (Bool) -> Void) {
                  completionHandler(true)
              }
          }

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let win = UIWindow(frame: UIScreen.main.bounds)
                  win.rootViewController = RootVC()
                  win.makeKeyAndVisible()
                  self.window = win
                  return true
              }
          }
          SWIFT_EOF

          # 5. Компилируем App.swift с явным флагом -parse-as-library
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK_PATH" \
                 -target arm64-apple-ios14.0 \
                 -framework UIKit \
                 -framework WebKit \
                 -framework Foundation \
                 -parse-as-library \
                 -O \
                 App.swift \
                 -o Payload/IronLog.app/IronLog

          chmod +x Payload/IronLog.app/IronLog
          zip -r IronLog_DDX.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronLog_DDX_IPA
          path: IronLog_DDX.ipa
