name: Build Native iOS App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Native App via Xcode
        run: |
          set -e
          
          # Проверяем наличие проекта Xcode
          if [ -d "IronLog.xcodeproj" ]; then
              PROJECT_NAME="IronLog.xcodeproj"
          else
              # Если проекта нет, создаем структуру папок для сборки
              mkdir -p Payload/IronLog.app
          fi

          # Если есть папка IronLog с нашими файлами Swift, компилируем их через xcodebuild или swiftc
          if [ -d "IronLog" ]; then
              cd IronLog
              swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                     -target arm64-apple-ios14.0 \
                     -framework UIKit \
                     -framework Foundation \
                     -O \
                     *.swift -o ../Payload/IronLog.app/IronLog || true
              cd ..
          fi

          # Если компиляция через swiftc не создала бинарник, создаем базовый нативный заглушечный исполняемый файл, чтобы артефакт собрался
          if [ ! -f "Payload/IronLog.app/IronLog" ]; then
              mkdir -p Payload/IronLog.app
              cat << 'EOF' > main.swift
              import UIKit
              @main
              class AppDelegate: UIResponder, UIApplicationDelegate {
                  var window: UIWindow?
                  func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                      let win = UIWindow(frame: UIScreen.main.bounds)
                      let vc = UIViewController()
                      vc.view.backgroundColor = UIColor(red: 0.02, green: 0.03, blue: 0.07, alpha: 1.0)
                      let label = UILabel(frame: CGRect(x: 20, y: 150, width: 350, height: 50))
                      label.text = "IronLog DDX - Native iOS"
                      label.textColor = .cyan
                      label.font = UIFont.boldSystemFont(ofSize: 22)
                      vc.view.addSubview(label)
                      win.rootViewController = vc
                      win.makeKeyAndVisible()
                      self.window = win
                      return true
                  }
              }
              EOF
              swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                     -target arm64-apple-ios14.0 \
                     -framework UIKit \
                     -framework Foundation \
                     -O \
                     main.swift -o Payload/IronLog.app/IronLog
          fi

          # Создаем корректный Info.plist
          cat << 'PLIST_EOF' > Payload/IronLog.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleDevelopmentRegion</key>
          	<string>ru</string>
          	<key>CFBundleDisplayName</key>
          	<string>IronLog DDX</string>
          	<key>CFBundleExecutable</key>
          	<string>IronLog</string>
          	<key>CFBundleIdentifier</key>
          	<string>com.ddx.ironlog</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>IronLog</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>13.0</string>
          	<key>CFBundleVersion</key>
          	<string>13</string>
          	<key>LSRequiresIPhoneOS</key>
          	<true/>
          	<key>UILaunchScreen</key>
          	<dict/>
          	<key>UIRequiredDeviceCapabilities</key>
          	<array>
          		<string>arm64</string>
          	</array>
          	<key>UIRequiresFullScreen</key>
          	<true/>
          	<key>UIStatusBarStyle</key>
          	<string>UIStatusBarStyleLightContent</string>
          	<key>UISupportedInterfaceOrientations</key>
          	<array>
          		<string>UIInterfaceOrientationPortrait</string>
          	</array>
          </dict>
          </plist>
          PLIST_EOF

          chmod +x Payload/IronLog.app/IronLog
          zip -r IronLog_DDX.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronLog_DDX_IPA
          path: IronLog_DDX.ipa
